services:
  db:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./db
    image: trainlog-migrate:${APP_VERSION:-dev}
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${DB_NAME}
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    image: trainlog-backend:${APP_VERSION:-dev}
    restart: unless-stopped
    stop_grace_period: 35s
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 8080
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    image: trainlog-frontend:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      PORT: 80
      BACKEND_URL: http://backend:8080
    ports:
      - "${APP_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
