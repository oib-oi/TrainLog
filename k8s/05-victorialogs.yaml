apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: v1
kind: Service
metadata:
  name: victorialogs
  namespace: logging
spec:
  selector:
    app: victorialogs
  ports:
    - port: 9428
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victorialogs
  namespace: logging
spec:
  serviceName: victorialogs
  replicas: 1
  selector:
    matchLabels:
      app: victorialogs
  template:
    metadata:
      labels:
        app: victorialogs
    spec:
      containers:
        - name: victorialogs
          image: victoriametrics/victoria-logs:v1.53.0
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=7d
            - -httpListenAddr=:9428
          ports:
            - containerPort: 9428
          readinessProbe:
            httpGet:
              path: /health
              port: 9428
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 9428
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: storage
              mountPath: /storage
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
